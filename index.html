<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./images/icon/meal.png" />
    <title>What's For Dinner</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <div class="brand">
          <div class="logo"><i class="fa-solid fa-utensils"></i></div>
          <div>
            <h1>What's For Dinner</h1>
            <p>Your daily meal inspiration</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="bookmarksBtn" title="Saved recipes">
            <i class="fa-solid fa-bookmark"></i>
          </button>
          <button id="historyBtn" title="History">
            <i class="fa-solid fa-clock-rotate-left"></i>
          </button>
          <button id="settingsBtn" title="Settings">
            <i class="fa-solid fa-gear"></i>
          </button>
          <img class="avatar" src="./images/avatar.jpg" alt="Profile" />
        </div>
      </div>
    </header>

    <main class="container">
      <article class="card" id="recipeCard"></article>
    </main>

    <!-- Side panel for bookmarks / history / settings -->
    <div class="overlay" id="overlay"></div>
    <aside class="panel" id="panel">
      <div class="panel-head">
        <h2 id="panelTitle"></h2>
        <button id="closePanel"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="panelBody"></div>
    </aside>

    <script src="./script.js"></script>
  </body>
</html>
